<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::content})}">
<head>
  <title>Groupes - HellMetz</title>
  <meta charset="UTF-8">
  <title>Modifier un utilisateur</title>
  <meta name="_csrf"        th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/css/backoffice.css}"    rel="stylesheet">
  <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
  <link th:href="@{/css/editUtilisateurStyle.css}" rel="stylesheet">
</head>
<body>
<div th:fragment="content">
<div class="container-fluid py-4 px-4">

  <div class="d-flex justify-content-between align-items-center mb-4 btn-retour">
    <a th:href="@{/festival/utilisateurs/liste}" class="btn btn-outline-secondary " >
      <i class="bi bi-arrow-left me-1"></i> Retour
    </a>
  </div>

  <div th:if="${not #strings.isEmpty(erreur)}"
       class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <span th:text="${erreur}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
  </div>

  <form method="post" th:action="@{/festival/utilisateurs/edit}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" name="id" th:value="${utilisateur.id}">

    <div class="row g-4">

      <div class="col-xl-6">
        <div class="hm-card">
          <div class="card-header py-3">
            <i class="bi bi-person-fill me-2"></i>Informations personnelles
          </div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-sm-6">
                <label class="form-label titrecard">Nom</label>
                <input type="text" class="form-control" name="nom" th:value="${utilisateur.nom}" required>
              </div>
              <div class="col-sm-6">
                <label class="form-label titrecard">Prénom</label>
                <input type="text" class="form-control" name="prenom" th:value="${utilisateur.prenom}" required>
              </div>
              <div class="col-12">
                <label class="form-label titrecard">Adresse email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" name="email" th:value="${utilisateur.email}" required>
                </div>
              </div>
              <div class="col-sm-6 mt-4">
                <small class="text-muted d-block mb-1">Date de création :</small>
                <strong th:text="${utilisateur.dateCreation != null ? #dates.format(utilisateur.dateCreation, 'dd/MM/yyyy') : '-'}"></strong>
              </div>
              <div class="col-sm-6 mt-4">
                <small class="text-muted d-block mb-1">Dernière connexion :</small>
                <strong th:text="${utilisateur.derniereConnexion != null ? #dates.format(utilisateur.derniereConnexion, 'dd/MM/yyyy') : 'Jamais'}"></strong>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-xl-6">
        <div class="hm-card">
          <div class="card-header py-3">
            <i class="bi bi-key-fill me-2"></i>Identifiants et Accès
          </div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label titrecard">Identifiant</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-at"></i></span>
                  <input type="text" class="form-control" name="identifiant" th:value="${utilisateur.identifiant}" required>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label titrecard">Nouveau mot de passe</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" name="motDePasse" id="motDePasse" placeholder="••••••••">
                  <button class="btn btn-outline-secondary" type="button" id="btnTogglePass" title="Afficher / masquer">
                    <i class="bi bi-eye" id="iconTogglePass"></i>
                  </button>
                </div>
                <div class="form-text mt-1 text-primary">
                  <i class="bi bi-info-circle me-1"></i>Laissez vide pour conserver le mot de passe actuel.
                </div>
              </div>

              <div class="col-12 mt-4 pt-3 border-top">
                <div class="form-check form-switch fs-5">
                  <input class="form-check-input" type="checkbox" name="actif" id="checkActif"
                         th:checked="${utilisateur.actif != null and utilisateur.actif}">
                  <label class="form-check-label fs-6 fw-bold ms-2 titrecard" for="checkActif">Compte actif</label>
                </div>
                <div class="form-text mt-1">Si désactivé, l'utilisateur ne pourra plus se connecter.</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="hm-card">
          <div class="card-header py-3">
            <i class="bi bi-shield-lock-fill me-2"></i>Rôle &amp; Permissions
          </div>
          <div class="card-body">
            <div class="row g-4 align-items-start">

              <div class="col-lg-4">
                <label class="form-label titrecard">Rôle de l'utilisateur</label>
                <select class="form-select" name="idRole" id="selectRole" required>
                  <option value="">-- Choisir un rôle --</option>
                  <option th:each="r : ${roles}"
                          th:value="${r.idRole}"
                          th:text="${r.libelle}"
                          th:selected="${utilisateur.roles != null
                                                         and !utilisateur.roles.isEmpty()
                                                         and utilisateur.roles[0].idRole == r.idRole}">
                  </option>
                </select>
              </div>

              <div class="col-lg-8">
                <div class="d-flex align-items-center mb-2 gap-2">
                  <label class="form-label mb-0 titrecard">Permissions accordées</label>
                  <span class="badge bg-primary rounded-pill" id="badgeCount">0</span>
                </div>

                <div class="perm-grid border rounded p-2">
                  <div class="perm-item"
                       th:each="p : ${permissions}"
                       th:id="'item_' + ${p.idPermission}"
                       th:classappend="${utilisateurPermissionsIds != null and utilisateurPermissionsIds.contains(p.idPermission)} ? 'checked' : ''">
                    <div class="form-check mb-0">
                      <input class="form-check-input chkPermission"
                             type="checkbox"
                             name="idsPermissions"
                             th:value="${p.idPermission}"
                             th:id="'perm_' + ${p.idPermission}"
                             th:checked="${utilisateurPermissionsIds != null and utilisateurPermissionsIds.contains(p.idPermission)}">
                      <label class="form-check-label w-100 user-select-none"
                             th:for="'perm_' + ${p.idPermission}">
                                                <span class="badge perm-badge me-1"
                                                      th:id="'badge_' + ${p.idPermission}"
                                                      th:classappend="${utilisateurPermissionsIds != null and utilisateurPermissionsIds.contains(p.idPermission)} ? 'bg-primary' : 'bg-secondary'"
                                                      th:text="${p.codePermission}"></span>
                        <small class="text-muted" th:text="${p.libelle}"></small>
                      </label>
                    </div>
                  </div>
                </div>

                <p class="mt-1 mb-0 text-muted titrecard" style="font-size: 0.8rem;">
                  Cliquez sur les cases pour personnaliser les accès.
                </p>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
      <a th:href="@{/festival/utilisateurs/liste}" class="btn btn-outline-secondary">
        <i class="bi bi-x-circle me-1"></i>Annuler
      </a>
      <button type="submit" class="btn btn-primary px-4">
        <i class="bi bi-save me-1"></i>Enregistrer les modifications
      </button>
    </div>
  </form>
</div>
<script th:inline="javascript">
  /*<![CDATA[*/
  var permissionsParRole = /*[[${permissionsParRole}]]*/ {};

  /* ── Mise à jour visuelle des permissions ── */
  function updateUI() {
    var count = 0;
    document.querySelectorAll(".chkPermission").forEach(function(cb) {
      var item  = document.getElementById("item_"  + cb.value);
      var badge = document.getElementById("badge_" + cb.value);
      if (cb.checked) {
        count++;
        item.classList.add("checked");
        badge.classList.replace("bg-secondary", "bg-primary");
      } else {
        item.classList.remove("checked");
        badge.classList.replace("bg-primary", "bg-secondary");
      }
    });
    document.getElementById("badgeCount").textContent = count;
  }

  /* ── Changement de rôle dans le select ── */
  document.getElementById("selectRole").addEventListener("change", function () {
    var idRole = this.value;

    /* Réinitialise et pré-coche selon le rôle */
    document.querySelectorAll(".chkPermission").forEach(function(cb) {
      cb.checked = false;
    });

    if (idRole && permissionsParRole[idRole]) {
      var permisAutorisees = permissionsParRole[idRole];
      document.querySelectorAll(".chkPermission").forEach(function(cb) {
        cb.checked = permisAutorisees.includes(parseInt(cb.value));
      });
    }

    updateUI();
  });

  /* ── Clic manuel sur une permission ── */
  document.querySelectorAll(".chkPermission").forEach(function(cb) {
    cb.addEventListener("change", updateUI);
  });

  /* ── Toggle afficher / masquer mot de passe ── */
  document.getElementById("btnTogglePass").addEventListener("click", function() {
    var input = document.getElementById("motDePasse");
    var icon  = document.getElementById("iconTogglePass");
    if (input.type === "password") {
      input.type    = "text";
      icon.className = "bi bi-eye-slash";
    } else {
      input.type    = "password";
      icon.className = "bi bi-eye";
    }
  });

  /* ── Init ── */
  // Exécuter l'UI une fois au chargement pour s'assurer que le compteur et les couleurs sont corrects
  updateUI();
  /*]]>*/
</script>
</div>
</body>
</html>
