<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<head>
    <title>Paramètres - HellMetz</title>
</head>
<body>
<div th:fragment="content">
    <div class="hm-card">
        <div class="hm-card-header">
            <div>
                <div class="hm-tag">Administration</div>
                <div class="hm-card-title">⚙️ Paramètres de l'application</div>
            </div>
        </div>

        <div class="p-4">
            <form th:action="@{/parametres}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-4 p-3" style="border:1px solid #333; border-radius:8px;">
                    <div style="color:#e67e22; font-weight:700; margin-bottom:16px;">⚙️ Général</div>
                    <div class="row justify-content-center">
                        <div th:each="p : ${parametres}" th:if="${#strings.startsWith(p.codeParametre, 'app.') and p.codeParametre != 'app.logo'}"
                             class="col-md-6 mb-3">
                            <input type="hidden" name="ids" th:value="${p.idParametre}">
                            <label class="form-label fw-bold" th:text="${p.libelleParametre}"></label>
                            <input type="text" class="form-control" name="valeurs" th:value="${p.valeurParametre}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Logo de l'application</label>
                            <input type="file" class="form-control" name="logoFile" accept="image/*">
                            <input type="hidden" name="deleteLogo" id="delete-logo-flag" value="false">

                            <div class="mt-2" id="logo-block" th:if="${appLogo != null}">
                                <small style="color:var(--hm-text-muted);">Logo actuel :</small><br>
                                <img id="app-logo" th:src="${appLogo}" alt="Logo"
                                     style="max-height: 40px; background: #222; padding: 4px; border-radius: 4px;">
                                <button class="btndel">
                                    <svg viewBox="0 0 15 17.5" height="17.5" width="15" xmlns="http://www.w3.org/2000/svg" class="icon">
                                        <path transform="translate(-2.5 -1.25)" d="M15,18.75H5A1.251,1.251,0,0,1,3.75,17.5V5H2.5V3.75h15V5H16.25V17.5A1.251,1.251,0,0,1,15,18.75ZM5,5V17.5H15V5Zm7.5,10H11.25V7.5H12.5V15ZM8.75,15H7.5V7.5H8.75V15ZM12.5,2.5h-5V1.25h5V2.5Z" id="Fill"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <script>
                            document.addEventListener('DOMContentLoaded', () => {
                                const btn = document.getElementById('delete-logo-btn');
                                if (!btn) return;

                                btn.addEventListener('click', () => {
                                    document.getElementById('delete-logo-flag').value = 'true';
                                    document.getElementById('logo-block')?.remove();
                                });
                            });
                        </script>
                    </div>
                </div>

                <div class="mb-4 p-3" style="border:1px solid #3d6baa; border-radius:8px;">
                    <div style="color:#3d9be9; font-weight:700; margin-bottom:16px;">🔑 Programmation</div>
                    <small style="color:var(--hm-text-muted);">Délais pris en compte lors de la génération du planning des scènes.</small>
                    <div class="row mt-2">
                        <div th:each="p : ${parametres}"
                             th:if="${#strings.startsWith(p.codeParametre, 'programmation.')}"
                             class="col-md-6 mb-3">
                            <input type="hidden" name="ids" th:value="${p.idParametre}">
                            <label class="form-label fw-bold" th:text="${p.libelleParametre}"></label>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <input type="number" class="form-control" name="valeurs" th:value="${p.valeurParametre}">
                                <span style="color:var(--hm-text-muted);">min</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-4 p-3" style="border:1px solid #333; border-radius:8px;">
                    <div style="color:#e67e22; font-weight:700; margin-bottom:16px;">✉️ Coordonnées</div>
                    <div class="row">
                        <div th:each="p : ${parametres}"
                             th:if="${#strings.startsWith(p.codeParametre, 'contact.')}"
                             class="col-md-6 mb-3">
                            <input type="hidden" name="ids" th:value="${p.idParametre}">
                            <label class="form-label fw-bold" th:text="${p.libelleParametre}"></label>
                            <input type="text" class="form-control" name="valeurs" th:value="${p.valeurParametre}">
                        </div>
                    </div>
                </div>

                <div class="mb-4 p-3" style="border:1px solid #333; border-radius:8px;">
                    <div style="color:#9b59b6; font-weight:700; margin-bottom:16px;">🖥️ Affichage & système</div>
                    <div class="row">
                        <div th:each="p : ${parametres}"
                             th:if="${#strings.startsWith(p.codeParametre, 'affichage.')}"
                             class="col-md-6 mb-3">

                            <input type="hidden" name="ids" th:value="${p.idParametre}">
                            <label class="form-label fw-bold" th:text="${p.libelleParametre}"></label>

                            <th:block th:if="${p.codeParametre == 'affichage.theme'}">
                                <select class="form-select" name="valeurs">
                                    <option value="Sombre" th:selected="${p.valeurParametre == 'Sombre'}">Sombre</option>
                                    <option value="Claire" th:selected="${p.valeurParametre == 'Claire'}">Claire</option>
                                </select>
                            </th:block>

                            <th:block th:unless="${p.codeParametre == 'affichage.theme'}">
                                <input type="text" class="form-control" name="valeurs" th:value="${p.valeurParametre}">
                            </th:block>

                        </div>
                    </div>
                </div>

                <div class="text-end mt-3">
                    <button type="submit" class="hm-btn-primary" style="border:none;">
                        <span>💾</span><span>Enregistrer</span>
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
