<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::content})}">
<head>
  <title>Scenes - HellMetz</title>
</head>
<body>
<div th:fragment="content">
  <div class="hm-card">
    <div class="hm-card-header">
      <div>
        <div class="hm-tag">Édition</div>
        <div class="hm-card-title">
          <span th:if="${scene.id != null}" th:text="'Modifier la scène : ' + ${scene.nom}"></span>
          <span th:unless="${scene.id != null}">Nouvelle scène</span>
        </div>
      </div>
      <a th:href="@{/scenes/liste}" class="hm-btn-primary"
         style="background-color:#6c757d; color:white; text-decoration:none;">
        <span>←</span><span>Retour à la liste</span>
      </a>
    </div>

    <div class="p-4">
      <form th:action="@{/scenes/edit}" method="post" enctype="multipart/form-data">

        <input type="hidden" name="id" th:value="${scene.id}">
        <input type="hidden" name="urlPlanTechnique" th:value="${scene.urlPlanTechnique}">

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="nom" class="form-label fw-bold">Nom de la scène <span class="text-danger">*</span></label>
            <input type="text" id="nom" name="nom" class="form-control"
                   th:value="${scene.nom}" required>
          </div>
          <div class="col-md-6">
            <label for="type" class="form-label fw-bold">Type</label>
            <input type="text" id="type" name="type" class="form-control"
                   th:value="${scene.type}">
          </div>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label fw-bold">Description</label>
          <textarea id="description" name="description" class="form-control"
                    rows="3" th:text="${scene.description}"></textarea>
        </div>

        <div class="row mb-3">
          <div class="col-md-3">
            <label for="capacite" class="form-label fw-bold">Capacité</label>
            <input type="number" id="capacite" name="capacite" class="form-control"
                   th:value="${scene.capacite}">
          </div>
          <div class="col-md-3">
            <label for="superficie" class="form-label fw-bold">Superficie (m²)</label>
            <input type="number" id="superficie" name="superficie" class="form-control"
                   th:value="${scene.superficie}">
          </div>
          <div class="col-md-6">
            <label for="planTechnique" class="form-label fw-bold">Changer le Plan Technique (PDF)</label>
            <input type="file" id="planTechnique" name="planTechnique" class="form-control" accept="application/pdf">
            <small th:if="${not #strings.isEmpty(scene.urlPlanTechnique)}"
                   class="text-muted"
                   th:text="'Fichier actuel : ' + ${scene.urlPlanTechnique}">
            </small>
          </div>
        </div>

        <div class="form-check form-switch mb-4 mt-3">
          <input class="form-check-input" type="checkbox" id="actif" name="actif"
                 value="true" th:checked="${scene.actif}">
          <label class="form-check-label fw-bold text-success" for="actif">Scène active</label>
        </div>

        <div th:if="${not #strings.isEmpty(scene.urlPlanTechnique)}"
             class="mt-4 border-top pt-3">
          <label class="fw-bold mb-2">Aperçu du Plan Technique actuel</label>
          <div style="background:#f8f9fa; border-radius:8px; padding:10px; border:1px solid #dee2e6;">
            <iframe th:src="@{/${scene.urlPlanTechnique}}"
                    width="100%" height="500px"
                    style="border:none; border-radius:4px;">
            </iframe>
          </div>
        </div>

        <div class="text-end mt-4 pt-3 border-top">
          <button type="submit" class="hm-btn-primary" style="border:none;">
            <span>💾</span><span>Enregistrer les modifications</span>
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
</body>
</html>
