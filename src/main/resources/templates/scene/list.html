<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::content})}">
<head>
    <title>Scenes - HellMetz</title>
</head>
<body>
<div th:fragment="content">
    <div class="hm-card">
        <div class="hm-card-header d-flex justify-content-between align-items-center">
            <div>
                <div class="hm-tag">Gestion</div>
                <div class="hm-card-title">Scènes du HellMetz Festival</div>
            </div>
            <a sec:authorize="hasAnyRole('ADMIN', 'ORGANISATEUR')"
               th:href="@{/scenes/ajouter}" class="hm-btn-primary">
                <span>＋</span><span>Nouvelle scène</span>
            </a>
        </div>

        <div style="display:flex; justify-content:flex-end; align-items:center; gap:.5rem; padding:.5rem 0;">
            <form th:action="@{/scenes/liste}" method="get"
                  style="display:flex; align-items:center; gap:.5rem; margin:0;">
                <input type="hidden" name="page" value="0">
                <label for="taille" style="font-size:.9rem;">Afficher</label>
                <select id="taille" name="taille" class="form-select" style="width:auto;"
                        onchange="this.form.submit()">
                    <option value="5"    th:selected="${taille == '5'}">5</option>
                    <option value="10"   th:selected="${taille == '10'}">10</option>
                    <option value="20"   th:selected="${taille == '20'}">20</option>
                    <option value="50"   th:selected="${taille == '50'}">50</option>
                    <option value="100"  th:selected="${taille == '100'}">100</option>
                    <option value="tout" th:selected="${taille == 'tout'}">Tout</option>
                </select>
                <span style="font-size:.9rem;">par page</span>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(scenes)}" style="padding: 40px; text-align: center;">
            <p>Aucune scène enregistrée pour le moment.</p>
        </div>

        <div th:unless="${#lists.isEmpty(scenes)}" class="table-responsive">
            <table class="hm-table">
                <thead>
                <tr>
                    <th>Nom</th>
                    <th>Description</th>
                    <th>Capacité</th>
                    <th>Type</th>
                    <th>Superficie</th>
                    <th>Plan technique</th>
                    <th sec:authorize="hasAnyRole('ADMIN', 'ORGANISATEUR')">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${scenes}">
                    <td><strong th:text="${s.nom}"></strong></td>
                    <td th:text="${s.description}"></td>
                    <td><span class="hm-pill" th:text="${s.capacite}"></span></td>
                    <td th:text="${s.type}"></td>
                    <td th:text="${s.superficie} + ' m²'"></td>
                    <td>
                        <a th:if="${not #strings.isEmpty(s.urlPlanTechnique)}"
                           class="hm-link-site"
                           th:href="@{/scenes/uploads/{url}(url=${s.urlPlanTechnique})}"
                           target="_blank" rel="noopener noreferrer">voir
                        </a>
                        <span th:unless="${not #strings.isEmpty(s.urlPlanTechnique)}"
                              class="text-muted">—</span>
                    </td>
                    <td sec:authorize="hasAnyRole('ADMIN', 'ORGANISATEUR')">
                        <a class="hm-link-site"
                           th:href="@{/scenes/ajouter(id=${s.id})}">
                            ✏️ éditer
                        </a>
                        &nbsp;|&nbsp;
                        <a class="hm-link-site"
                           th:href="@{/scenes/delete/{id}(id=${s.id})}"
                           onclick="return confirm('Supprimer cette scène ?');">
                            🗑️ supprimer
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
            <nav th:if="${taille != 'tout' and page.totalPages > 1}"
                 style="display:flex; justify-content:space-between; align-items:center; padding:1rem 0;">
                <span style="font-size:.85rem; color:var(--hm-text-muted);"
                      th:text="${page.totalElements} + ' scènes au total'">0 scènes</span>
                <ul class="pagination mb-0">
                    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/scenes/liste(page=${page.number - 1}, taille=${taille})}">‹</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                        th:classappend="${i == page.number} ? 'active'">
                        <a class="page-link"
                           th:href="@{/scenes/liste(page=${i}, taille=${taille})}"
                           th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/scenes/liste(page=${page.number + 1}, taille=${taille})}">›</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
