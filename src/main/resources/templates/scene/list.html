<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::content})}">
<head>
    <title>Scenes</title>
</head>
<body>
<div th:fragment="content">
    <div class="hm-card">
        <div class="hm-card-header d-flex justify-content-between align-items-center">
            <div>
                <div class="hm-tag">Gestion</div>
                <div class="hm-card-title" th:text="'Scènes du ' + ${appNom} + ' Festival'">Scènes</div>
            </div>
            <a sec:authorize="hasAnyRole('ADMIN', 'ORGANISATEUR')"
               th:href="@{/scenes/ajouter}" class="hm-btn-primary">
                <span>＋</span>
                <span>Nouvelle scène</span>
            </a>
        </div>

        <div th:if="${#lists.isEmpty(scenes)}" style="padding: 40px; text-align: center;">
            <p>Aucune scène enregistrée pour le moment.</p>
        </div>

        <div th:unless="${#lists.isEmpty(scenes)}" class="table-responsive">
            <table class="hm-table">
                <thead>
                <tr>
                    <th>Nom</th>
                    <th>Description</th>
                    <th>Capacité</th>
                    <th>Type</th>
                    <th>Superficie</th>
                    <th>Plan technique</th>
                    <th sec:authorize="hasAnyRole('ADMIN', 'ORGANISATEUR')">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${scenes}">
                    <td><strong th:text="${s.nom}"></strong></td>
                    <td th:text="${s.description}"></td>
                    <td><span class="hm-pill" th:text="${s.capacite}"></span></td>
                    <td th:text="${s.type}"></td>
                    <td th:text="${s.superficie} + ' m²'"></td>
                    <td>
                        <a th:if="${not #strings.isEmpty(s.urlPlanTechnique)}"
                           class="hm-link-site"
                           th:href="@{/scenes/uploads/{url}(url=${s.urlPlanTechnique})}"
                           target="_blank" rel="noopener noreferrer">voir
                        </a>
                        <span th:unless="${not #strings.isEmpty(s.urlPlanTechnique)}"
                              class="text-muted">—</span>
                    </td>
                    <td sec:authorize="hasAnyRole('ADMIN', 'ORGANISATEUR')">
                        <a class="hm-link-site"
                           th:href="@{/scenes/ajouter(id=${s.id})}">
                            ✏️ éditer
                        </a>
                        &nbsp;|&nbsp;
                        <form th:action="@{/scenes/delete/{id}(id=${s.id})}" method="post" style="display:inline;"
                              onsubmit="return confirm('Supprimer cette scène ?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="hm-link-site"
                                    style="background:none;border:none;padding:0;color:#e74c3c;cursor:pointer;">
                                🗑️ supprimer
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
