<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<head>
    <title>Personnaliser</title>
</head>
<body>
<div th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/parametresDashboardStyle.css}">

    <div class="hm-card">
        <div class="hm-card-header">
            <div class="hm-card-title">⚙️ Mes widgets</div>
        </div>
        <p style="color:var(--hm-text-muted);">Coche pour afficher, glisse pour réordonner.</p>

        <form id="form-widgets" th:action="@{/dashboard/parametres}" method="post">
            <ul id="liste-widgets" class="list-group mb-3">
                <li class="list-group-item d-flex align-items-center gap-3"
                    th:each="w : ${affichage}">
                    <span class="poignee" title="Glisser pour réordonner">⠿</span>
                    <input type="checkbox"
                           th:id="'widget-' + ${w.name()}"
                           name="widgets"
                           th:value="${w.name()}"
                           th:checked="${visibles.contains(w)}">
                    <label class="widget-label"
                           th:for="'widget-' + ${w.name()}"
                           th:text="${w.libelle}">Widget</label>
                </li>
            </ul>

            <div id="widgets-error-msg"
                 class="alert alert-warning py-2 px-3 mb-3 small fw-bold widgets-alert"
                 style="display: none;">
                ⚠️ Au moins un widget doit être coché pour enregistrer votre tableau de bord.
            </div>

            <button type="submit" id="btn-save-widgets" class="hm-btn-primary">
                <span>💾</span><span>Enregistrer</span>
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script th:src="@{/js/parametresDashboard.js}"></script>
</div>
</body>
</html>
