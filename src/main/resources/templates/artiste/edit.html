<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::content})}">
<head>
  <title>Artistes</title>
</head>
<body>
<div th:fragment="content">
  <div class="hm-card">
    <div class="hm-card-header">
      <div>
        <div class="hm-tag">Artiste</div>
        <div class="hm-card-title">
          <span th:if="${artiste.id != null}" th:text="'Modifier artiste : ' + ${artiste.nom}"></span>
          <span th:unless="${artiste.id != null}">Nouvel artiste</span>
        </div>
      </div>
      <a th:href="${idGroupeParam != null} ? @{/groupes/ajouter(id=${idGroupeParam})} : @{/artistes/liste}"
         class="hm-btn-primary" style="background-color:#6c757d; color:white;">
        <span>←</span><span>Retour à la liste</span>
      </a>
    </div>

    <div class="p-4">
      <form th:action="@{/artistes/edit}" method="post" enctype="multipart/form-data">

        <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>

        <input th:if="${artiste.id != null}" type="hidden" name="id" th:value="${artiste.id}">
        <input th:if="${idGroupeParam != null}" type="hidden" name="idGroupeParam" th:value="${idGroupeParam}">
        <input type="hidden" name="supprimerPhoto" id="supprimer_photo" value="false">
        <input type="hidden" name="urlPhoto" id="urlPhoto" th:value="${artiste.urlPhoto}">

        <div class="row mb-3">
          <div class="col-auto" style="text-align:center">
            <label for="artistePhoto" style="cursor:pointer; display:inline-block;">
              <img id="preview"
                   th:src="${not #strings.isEmpty(artiste.urlPhoto)} ? @{/uploads/artiste_image/{p}(p=${artiste.urlPhoto})} : @{/images/artistes/defaultAvatar.png}"
                   style="width:180px; height:180px; border-radius:5%; object-fit:cover;">
            </label>
            <input type="file" id="artistePhoto" name="artistePhoto" accept="image/png, image/jpeg, image/gif, image/webp, image/svg+xml" style="display:none;">
            <div id="containerBtnSupprimer"
                 th:style="${#strings.isEmpty(artiste.urlPhoto)} ? 'display:none; margin-top:6px;' : 'display:block; margin-top:6px;'">
              <button type="button" id="btnSupprimerPhoto" class="hm-btn-primary"
                      style="background-color:#6c757d; color:white;">
                🗑️ Supprimer la photo
              </button>
            </div>
          </div>

          <div class="col mb-3" style="display:flex; flex-direction:column; justify-content:space-between; height:180px;">
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="nom" class="form-label fw-bold">Nom <span class="text-danger">*</span></label>
                <input type="text" id="nom" name="nom" class="form-control"
                       th:value="${artiste.nom}" required>
              </div>
              <div class="col-md-6">
                <label for="prenom" class="form-label fw-bold">Prénom <span class="text-danger">*</span></label>
                <input type="text" id="prenom" name="prenom" class="form-control"
                       th:value="${artiste.prenom}" required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <label for="nomScene" class="form-label fw-bold">Nom de scène</label>
                <input type="text" id="nomScene" name="nomScene" class="form-control"
                       th:value="${artiste.nomScene}">
              </div>
              <div class="col-md-6">
                <label for="nationalite" class="form-label fw-bold">Nationalité</label>
                <input type="text" id="nationalite" name="nationalite" class="form-control"
                       th:value="${artiste.nationalite}">
              </div>
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-12">
            <label for="biographie" class="form-label fw-bold">Biographie</label>
            <textarea id="biographie" name="biographie" class="form-control"
                      style="height:200px" th:text="${artiste.biographie}"></textarea>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">Styles du groupe :</label>
            <div style="position: relative; width: 100%;">

              <div class="form-control" id="dropdownTrigger"
                   style="cursor: pointer; display: flex; justify-content: space-between; align-items: center; background-color: #ffffff; color: #212529; min-height: 38px;">
                <span id="dropdownLabel" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%;">Choisir le(s) style(s)</span>
                <span style="font-size: 0.7rem; color: #6c757d;">▼</span>
              </div>

              <div id="dropdownMenu"
                   style="display: none; position: absolute; top: 100%; left: 0; right: 0;
                          background: #1a1a2e; border: 1px solid #454d55; border-radius: 4px;
                          max-height: 200px; overflow-y: auto; z-index: 1000; padding: 10px; box-shadow: 0px 4px 15px rgba(0,0,0,0.5);">

                <div class="form-check mb-2" th:each="style : ${styles}">
                  <input class="form-check-input style-checkbox"
                         type="checkbox"
                         name="stylesId"
                         th:value="${style.id}"
                         th:data-nom="${style.libelle}"
                         th:id="${'style_' + style.id}"
                         th:checked="${artiste != null and artiste.styles != null and #lists.contains(artiste.styles, style)}">

                  <label class="form-check-label text-white"
                         th:for="${'style_' + style.id}"
                         th:text="${style.libelle}"
                         style="cursor: pointer;">
                    Nom du Style
                  </label>
                </div>

              </div>
            </div>
          </div>

          <div class="col-md-6">
            <label for="exigencesCatering" class="form-label fw-bold">Exigences</label>
            <textarea id="exigencesCatering" name="exigencesCatering"
                      class="form-control" th:text="${artiste.exigencesCatering}"></textarea>
          </div>
        </div>

        <div class="text-end mt-4 pt-3 border-top">
          <button type="submit" class="hm-btn-primary" style="border:none;">
            <span>💾</span><span>Enregistrer</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script th:inline="javascript">
    const defaultAvatarUrl = /*[[@{/images/artistes/defaultAvatar.png}]]*/ '';

    const containerBtn = document.getElementById('containerBtnSupprimer');
    const inputPhoto = document.getElementById('artistePhoto');

    inputPhoto.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('preview').src = URL.createObjectURL(file);
        document.getElementById('supprimer_photo').value = "false";

        if (containerBtn) {
          containerBtn.style.display = "block";
        }
      }
    });

    const btnSuppr = document.getElementById('btnSupprimerPhoto');
    if (btnSuppr) {
      btnSuppr.addEventListener('click', function() {
        document.getElementById('preview').src = defaultAvatarUrl;
        document.getElementById('urlPhoto').value = "";
        inputPhoto.value = "";
        document.getElementById('supprimer_photo').value = "true";

        if (containerBtn) {
          containerBtn.style.display = "none";
        }
      });
    }
    // Gestion du dropdown des styles
    const dropdownTrigger = document.getElementById('dropdownTrigger');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const dropdownLabel = document.getElementById('dropdownLabel');
    const styleCheckboxes = document.querySelectorAll('.style-checkbox');

    if (dropdownTrigger && dropdownMenu) {
      dropdownTrigger.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdownMenu.style.display = dropdownMenu.style.display === 'none' ? 'block' : 'none';
      });

      // Fermer le menu si on clique ailleurs sur la page
      document.addEventListener('click', function(e) {
        if (!dropdownMenu.contains(e.target) && !dropdownTrigger.contains(e.target)) {
          dropdownMenu.style.display = 'none';
        }
      });
    }

    function updateDropdownLabel() {
      const checked = Array.from(styleCheckboxes).filter(cb => cb.checked);
      if (checked.length === 0) {
        dropdownLabel.textContent = "Choisir le(s) style(s)";
      } else {
        dropdownLabel.textContent = checked.map(cb => cb.getAttribute('data-nom')).join(', ');
      }
    }

    styleCheckboxes.forEach(cb => cb.addEventListener('change', updateDropdownLabel));
    updateDropdownLabel(); // Initialise le texte au chargement (en mode édition)
  </script>
</div>
</body>
</html>
