<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Accès refusé</title>

    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/errorStyle.css">

</head>
<body>
    <div class="container error-page d-flex align-items-center">
        <div class="row align-items-center w-100 g-5">
            <h1 class="error-code">403</h1>
            <div class="col-lg-6 text-center text-lg-start">
                <div class="error-title mb-3">Oups ! Le compte n'a pas les droits.</div>
                <p class="error-text fs-5 mb-4">
                    Vous n'avez pas accès à la page que vous cherchez à accèder.
                </p>

                <a th:href="@{/dashboard}" class="btn btn-neon">
                    Retour à l'accueil
                </a>

                <a th:href="@{/logout}" class="btn btn-neon">
                    Se deconnecter
                </a>
            </div>
        </div>
    </div>
</body>
</html>
